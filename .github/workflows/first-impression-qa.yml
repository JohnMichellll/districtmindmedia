name: District Mind Media — First Impression Bot QA

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "style.css"
      - "**/*.js"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/first-impression-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: district-mind-first-impression
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Run first-impression browser bots
        run: |
          npm install --no-save playwright@1.55.0
          node scripts/first-impression-qa.mjs
      - name: Publish QA report
        if: always()
        run: |
          git config user.name "District Mind First Impression Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f reports/first-impression-qa-latest.json || exit 0
          git add reports/first-impression-qa-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(qa): refresh first-impression browser audit"
          git pull --rebase origin main
          git push

# QA trigger: validate current production build
