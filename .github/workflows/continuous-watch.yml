name: District Mind — Continuous Security & Uptime Watch

on:
  schedule:
    - cron: "11 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: district-mind-uptime-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check production homepage
        id: home
        continue-on-error: true
        run: |
          curl -fsSL --max-time 20 -o /tmp/home.html -w "HTTP=%{http_code} TIME=%{time_total}\n" https://district-mind-media.pages.dev/
          grep -qi "District Mind" /tmp/home.html

      - name: Check critical routes
        id: routes
        continue-on-error: true
        run: |
          set -e
          for path in /newsroom.html /radar.html /local.html /wayfinder.html /artists.html /releases.html; do
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://district-mind-media.pages.dev$path")
            echo "$path => $code"
            test "$code" = "200"
          done

      - name: Check security headers
        id: headers
        continue-on-error: true
        run: |
          set -e
          curl -fsSI --max-time 20 https://district-mind-media.pages.dev/ | tee /tmp/headers.txt
          grep -qi "content-security-policy" /tmp/headers.txt
          grep -qi "x-content-type-options: nosniff" /tmp/headers.txt
          grep -qi "x-frame-options: DENY" /tmp/headers.txt

      - name: Open a GitHub incident if production is unhealthy
        if: steps.home.outcome == 'failure' || steps.routes.outcome == 'failure' || steps.headers.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Production health/security check failed';
            const labels = ['production','security'];
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state:'open', labels: labels.join(',')});
            if (!open.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels,
                body: [
                  'Automated uptime/security watch detected a failure.',
                  '',
                  'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                  'This bot reports the incident without automatically deploying an unverified fix.'
                ].join('\n')
              });
            }
