name: District Mind Media — Daily Photo Scout

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh rights-cleared artist photos
        run: node scripts/photo-refresh.mjs

      - name: Optional Grok photo/editor pass
        if: ${{ secrets.XAI_API_KEY != '' }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node scripts/grok-photo-pass.mjs

      - name: Commit changed manifest
        run: |
          git config user.name "District Mind Photo Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photo-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh artist photography"
          git push
