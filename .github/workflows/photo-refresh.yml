name: District Mind Media — Daily Photo Scout

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: district-mind-photo-refresh
  cancel-in-progress: false

jobs:
  refresh-photos:
    runs-on: ubuntu-latest
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh rights-cleared artist photos
        run: node scripts/photo-refresh.mjs

      - name: Optional Grok photo/editor pass
        shell: bash
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            node scripts/grok-photo-pass.mjs
          else
            echo "XAI_API_KEY not configured — skipping Grok photo pass."
          fi

      - name: Run newsroom QA review
        shell: bash
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            node scripts/grok-site-qa.mjs
          else
            echo "XAI_API_KEY not configured — skipping Grok QA review."
          fi

      - name: Commit changed photo/QA files
        shell: bash
        run: |
          git config user.name "District Mind Photo Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photo-manifest.json
          if [ -f reports/grok-site-qa.md ]; then
            git add reports/grok-site-qa.md
          fi
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh artist photography and newsroom QA"
          git push
