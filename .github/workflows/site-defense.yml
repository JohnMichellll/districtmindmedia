name: District Mind Media — Site Defense

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "style.css"
      - "functions/**"
      - "photo-loader.js"
      - "release-artwork-loader.js"
      - "assets/**"
      - "scripts/site-defense.mjs"
      - ".github/workflows/site-defense.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: district-mind-site-defense-${{ github.ref }}
  cancel-in-progress: true

jobs:
  defense:
    name: Site Defense / Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated defense
        run: node scripts/site-defense.mjs

      - name: Publish defense telemetry
        run: |
          git config user.name "District Mind Site Defense"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/site-defense-latest.json
          git diff --cached --quiet || git commit -m "chore(defense): refresh integrity telemetry"
          git pull --rebase origin main
          git push

      - name: Print production target
        run: |
          echo "Production target: https://district-mind-media.pages.dev/"
          echo "Primary branch: main"
