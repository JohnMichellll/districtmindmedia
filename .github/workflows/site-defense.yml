name: District Mind Media — Site Defense

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "style.css"
      - "functions/**"
      - "photo-loader.js"
      - "release-artwork-loader.js"
      - "assets/**"
      - "scripts/site-defense.mjs"
      - ".github/workflows/site-defense.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

  workflow_run:
    workflows: ["District Mind — AI Newsroom Operator"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: district-mind-site-defense-${{ github.ref }}
  cancel-in-progress: true

jobs:
  defense:
    name: Site Defense / Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated defense
        run: node scripts/site-defense.mjs

      - name: Publish defense telemetry
        run: |
          git config user.name "District Mind Site Defense"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/site-defense-latest.json
          if git diff --cached --quiet; then
            echo "Defense telemetry unchanged; no commit needed."
            exit 0
          fi
          git commit -m "chore(defense): refresh integrity telemetry"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "Another automation refreshed telemetry at the same time; keeping the successful defense result and skipping this redundant report commit."
            exit 0
          fi
          if ! git push; then
            echo "Another automation won the telemetry push race; defense checks already passed, so skipping this redundant report commit."
          fi

      - name: Print production target
        run: |
          echo "Production target: https://district-mind-media.pages.dev/"
          echo "Primary branch: main"
