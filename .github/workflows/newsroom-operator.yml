name: District Mind — AI Newsroom Operator

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: district-mind-newsroom-operator
  cancel-in-progress: true

jobs:
  newsroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run newsroom scouts
        run: node scripts/newsroom-operator.mjs
      - name: Publish newsroom report to repo
        run: |
          git config user.name "District Mind Newsroom Operator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/newsroom-latest.json reports/newsroom-latest.md
          git diff --cached --quiet || git commit -m "chore(newsroom): refresh intelligence report"
          git push
